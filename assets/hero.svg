<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">aunsh</title>
<desc id="desc">Aunsh builds agents that show their work. An agent asks who aunsh is and calls five tools. search: MS ECE, UC Davis. career: co-founder at 8W Research now, software developer at UC Davis and founding engineer at mlpal.ai from 2024, software engineer at Prosperix in 2023. read: FRED at biofred.us, spatial agents over 11.8 million rows with about 1,450 tests, and an agent that opens, reviews and merges its own PRs. status: open to forward-deployed, AI and SWE roles.</desc>
<defs>
<linearGradient id="grad" x1="0" x2="1" y1="0" y2="0"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--arg)"/></linearGradient>
<filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<style>:root{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--text:#1f2328;--muted:#59636e;--accent:#c4371a;--arg:#0550ae;--ok:#1a7f37;--warn:#9a6700}@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#ff7b5c;--arg:#79c0ff;--ok:#3fb950;--warn:#d29922}}
text{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:15px;fill:var(--text);white-space:pre}
.m{fill:var(--muted)}.fn{fill:var(--accent)}.arg{fill:var(--arg)}.ok{fill:var(--ok)}.b{font-weight:700}
.q{font-weight:600}.r{fill:var(--text)}.hd{font-size:12.5px;fill:var(--muted)}
.name{font-size:64px;font-weight:800;letter-spacing:-1px;fill:var(--text)}
.glow{fill:var(--accent);opacity:0}
.ans{fill:var(--panel);stroke:var(--line)}
.a{opacity:0;animation:in .3s ease-out forwards}
.glow.a{animation-name:glow}
.flash{opacity:0;animation-name:flash;animation-timing-function:linear;animation-fill-mode:forwards}
.p{opacity:0;animation-name:flash;animation-timing-function:linear;animation-fill-mode:forwards}
.spin{transform-box:fill-box;transform-origin:center;animation:spin .6s linear infinite}
.type{clip-path:inset(0 100% 0 0);animation-name:type;animation-fill-mode:forwards}
.cur{fill:var(--accent);animation:blink 1.1s steps(1) infinite}
.live{fill:var(--ok);animation:pulse 1.6s ease-in-out infinite}
@keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes glow{to{opacity:.35}}
@keyframes flash{0%,85%{opacity:1}to{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes type{to{clip-path:inset(0 0 0 0)}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){
.a,.type,.cur,.live{animation:none;opacity:1;clip-path:none;transform:none}
.glow.a{opacity:.35}.flash,.p{display:none}
}</style>
<rect x="0.5" y="0.5" width="759" height="519" rx="12" fill="var(--bg)" stroke="var(--line)"/>
<circle cx="32" cy="20" r="4" class="live"/>
<text x="44" y="24" class="hd">aunsh/agent</text>
<text x="732" y="24" text-anchor="end" class="hd">5 tool calls · streaming</text>
<path d="M1 38.5H759" stroke="var(--line)"/>
<text x="28" y="112" class="name flash" style="animation-delay:0.20s;animation-duration:0.06s">#x9@k</text>
<text x="28" y="112" class="name flash" style="animation-delay:0.26s;animation-duration:0.06s">q7%$a</text>
<text x="28" y="112" class="name flash" style="animation-delay:0.32s;animation-duration:0.06s">a&amp;!zh</text>
<text x="28" y="112" class="name flash" style="animation-delay:0.38s;animation-duration:0.06s">au?1s</text>
<text x="28" y="112" class="name flash" style="animation-delay:0.44s;animation-duration:0.06s">aun/h</text>
<text x="28" y="112" class="name flash" style="animation-delay:0.50s;animation-duration:0.06s">auns_</text>
<text x="28" y="112" class="name glow a" style="animation-delay:0.56s" filter="url(#blur)">aunsh</text>
<text x="28" y="112" class="name a" style="fill:url(#grad);animation-delay:0.56s">aunsh</text>
<text x="30" y="144" class="type" style="animation-delay:0.66s;animation-duration:0.38s;animation-timing-function:steps(35,jump-none)"><tspan class="m">builds agents that show their work</tspan></text>
<path d="M28 168.5H732" stroke="var(--line)" stroke-dasharray="3 4" class="a" style="animation-delay:1.04s"/>
<text x="28" y="190" class="fn a" style="animation-delay:1.14s">&gt;</text>
<text x="46" y="190" class="type" style="animation-delay:1.14s;animation-duration:0.29s;animation-timing-function:steps(14,jump-none)"><tspan class="q">who is aunsh?</tspan></text>
<g class="p" style="animation-delay:1.53s;animation-duration:0.22s"><circle cx="34" cy="219" r="5.5" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="34" cy="219" r="5.5" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="9 26" stroke-linecap="round" class="spin"/></g>
<text x="50" y="224" class="a" style="animation-delay:1.53s"><tspan class="fn">search</tspan><tspan class="m">(</tspan><tspan class="arg">&quot;aunsh&quot;</tspan><tspan class="m">)</tspan></text>
<text x="29" y="224" class="ok a" style="animation-delay:1.75s">✓</text>
<text x="248" y="224" class="m a" style="animation-delay:1.75s">→</text>
<text x="270" y="224" class="type" style="animation-delay:1.75s;animation-duration:0.28s;animation-timing-function:steps(43,jump-none)"><tspan class="r">one human. MS ECE, UC Davis. ships agents.</tspan></text>
<g class="p" style="animation-delay:2.08s;animation-duration:0.22s"><circle cx="34" cy="249" r="5.5" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="34" cy="249" r="5.5" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="9 26" stroke-linecap="round" class="spin"/></g>
<text x="50" y="254" class="a" style="animation-delay:2.08s"><tspan class="fn">career</tspan><tspan class="m">()</tspan></text>
<text x="29" y="254" class="ok a" style="animation-delay:2.30s">✓</text>
<text x="248" y="254" class="m a" style="animation-delay:2.30s">→</text>
<text x="270" y="254" class="type" style="animation-delay:2.30s;animation-duration:0.19s;animation-timing-function:steps(30,jump-none)"><tspan class="m">now   </tspan><tspan class="r">co-founder, </tspan><tspan class="b">8W Research</tspan></text>
<text x="270" y="278" class="type" style="animation-delay:2.42s;animation-duration:0.23s;animation-timing-function:steps(35,jump-none)"><tspan class="m">2024  </tspan><tspan class="r">software developer, </tspan><tspan class="b">UC Davis</tspan></text>
<text x="270" y="302" class="type" style="animation-delay:2.54s;animation-duration:0.22s;animation-timing-function:steps(34,jump-none)"><tspan class="m">2024  </tspan><tspan class="r">founding engineer, </tspan><tspan class="b">mlpal.ai</tspan></text>
<text x="270" y="326" class="type" style="animation-delay:2.66s;animation-duration:0.23s;animation-timing-function:steps(35,jump-none)"><tspan class="m">2023  </tspan><tspan class="r">software engineer, </tspan><tspan class="b">Prosperix</tspan></text>
<g class="p" style="animation-delay:2.93s;animation-duration:0.22s"><circle cx="34" cy="351" r="5.5" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="34" cy="351" r="5.5" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="9 26" stroke-linecap="round" class="spin"/></g>
<text x="50" y="356" class="a" style="animation-delay:2.93s"><tspan class="fn">read</tspan><tspan class="m">(</tspan><tspan class="arg">&quot;biofred.us&quot;</tspan><tspan class="m">)</tspan></text>
<text x="29" y="356" class="ok a" style="animation-delay:3.15s">✓</text>
<text x="248" y="356" class="m a" style="animation-delay:3.15s">→</text>
<text x="270" y="356" class="type" style="animation-delay:3.15s;animation-duration:0.31s;animation-timing-function:steps(47,jump-none)"><tspan class="r">FRED. spatial agents, 11.8M rows, ~1,450 tests</tspan></text>
<g class="p" style="animation-delay:3.51s;animation-duration:0.22s"><circle cx="34" cy="381" r="5.5" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="34" cy="381" r="5.5" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="9 26" stroke-linecap="round" class="spin"/></g>
<text x="50" y="386" class="a" style="animation-delay:3.51s"><tspan class="fn">prs</tspan><tspan class="m">(</tspan><tspan class="m">author=</tspan><tspan class="arg">&quot;agent&quot;</tspan><tspan class="m">)</tspan></text>
<text x="29" y="386" class="ok a" style="animation-delay:3.73s">✓</text>
<text x="248" y="386" class="m a" style="animation-delay:3.73s">→</text>
<text x="270" y="386" class="type" style="animation-delay:3.73s;animation-duration:0.22s;animation-timing-function:steps(34,jump-none)"><tspan class="r">opens, reviews and merges its own</tspan></text>
<g class="p" style="animation-delay:4.00s;animation-duration:0.22s"><circle cx="34" cy="411" r="5.5" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="34" cy="411" r="5.5" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="9 26" stroke-linecap="round" class="spin"/></g>
<text x="50" y="416" class="a" style="animation-delay:4.00s"><tspan class="fn">check</tspan><tspan class="m">(</tspan><tspan class="arg">&quot;status&quot;</tspan><tspan class="m">)</tspan></text>
<text x="29" y="416" class="ok a" style="animation-delay:4.22s">✓</text>
<text x="248" y="416" class="m a" style="animation-delay:4.22s">→</text>
<text x="270" y="416" class="type" style="animation-delay:4.22s;animation-duration:0.22s;animation-timing-function:steps(34,jump-none)"><tspan class="r">open to forward-deployed, AI, SWE</tspan></text>
<rect x="18" y="435" width="724" height="32" rx="6" class="ans a" style="animation-delay:4.59s"/>
<text x="28" y="456" class="ok b a" style="animation-delay:4.59s">answer</text>
<text x="108" y="456" class="type" style="animation-delay:4.64s;animation-duration:0.68s;animation-timing-function:steps(62,jump-none)"><tspan class="b">Aunsh builds agents that show their work. Worth an interview.</tspan></text>
<text x="28" y="496" class="a" style="animation-delay:5.52s"><tspan class="fn">&gt; </tspan><tspan class="cur">█</tspan></text>
</svg>
