<svg xmlns="http://www.w3.org/2000/svg" width="760" height="464" viewBox="0 0 760 464" role="img" aria-labelledby="title desc">
<title id="title">who is aunsh?</title>
<desc id="desc">An agent answers who Aunsh is by calling four tools. search finds an MS ECE from UC Davis. retrieve lists fred, switchboard and watchtower. rank puts fred first: live at biofred.us, about 1,450 tests, merges its own PRs. check says open to forward-deployed, AI and SWE roles. Answer: Aunsh builds agents that show their work, then ships them.</desc>
<style>:root{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--text:#1f2328;--muted:#59636e;--accent:#c4371a;--arg:#0550ae;--ok:#1a7f37;--warn:#9a6700}@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#ff7b5c;--arg:#79c0ff;--ok:#3fb950;--warn:#d29922}}
text{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:15px;fill:var(--text);white-space:pre}
.m{fill:var(--muted)}.fn{fill:var(--accent)}.arg{fill:var(--arg)}.ok{fill:var(--ok)}.b{font-weight:600}
.hd{font-size:13px;fill:var(--muted)}
.a{opacity:0;animation:in .35s ease-out forwards}
.p{opacity:0;animation-name:pend;animation-timing-function:linear;animation-fill-mode:forwards}
.type{clip-path:inset(0 100% 0 0);animation-name:type;animation-duration:0.9s;animation-fill-mode:forwards}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes pend{0%{opacity:0}1%,40%{opacity:1}55%,70%{opacity:.35}85%,99%{opacity:1}100%{opacity:0}}
@keyframes type{to{clip-path:inset(0 0 0 0)}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){
.a,.type,.cur{animation:none;opacity:1;clip-path:none;transform:none}.p{display:none}
}</style>
<rect x="0.5" y="0.5" width="759" height="463" rx="10" fill="var(--bg)" stroke="var(--line)"/>
<path d="M1 36.5H759" stroke="var(--line)"/>
<rect x="1" y="1" width="758" height="35" rx="9" fill="var(--panel)"/>
<rect x="1" y="20" width="758" height="16" fill="var(--panel)"/>
<text x="28" y="23" class="hd">agent run</text>
<text x="732" y="23" text-anchor="end" class="hd">4 tool calls</text>
<text x="28" y="64"><tspan class="fn">&gt; </tspan><tspan class="type" style="animation-delay:0.4s;animation-timing-function:steps(13)">who is aunsh?</tspan></text>
<text x="46" y="100" class="a" style="animation-delay:1.60s"><tspan class="fn">search</tspan><tspan class="m">(</tspan><tspan class="arg">&quot;aunsh&quot;</tspan><tspan class="m">)</tspan></text>
<text x="732" y="100" text-anchor="end" class="p m" style="animation-delay:1.60s;animation-duration:0.7s">running</text>
<text x="732" y="100" text-anchor="end" class="a ok" style="animation-delay:2.30s">ok</text>
<text x="64" y="124" class="a" style="animation-delay:2.40s"><tspan class="t">Aunsh Bandivadekar. MS ECE, UC Davis. Software engineer.</tspan></text>
<text x="46" y="156" class="a" style="animation-delay:2.58s"><tspan class="fn">retrieve</tspan><tspan class="m">(</tspan><tspan class="arg">projects</tspan><tspan class="m">, limit=</tspan><tspan class="arg">3</tspan><tspan class="m">)</tspan></text>
<text x="732" y="156" text-anchor="end" class="p m" style="animation-delay:2.58s;animation-duration:0.7s">running</text>
<text x="732" y="156" text-anchor="end" class="a ok" style="animation-delay:3.28s">ok</text>
<text x="64" y="180" class="a" style="animation-delay:3.38s"><tspan class="b">fred         </tspan><tspan class="t">an agent loop over an 11.8M-row PostGIS store</tspan></text>
<text x="64" y="204" class="a" style="animation-delay:3.56s"><tspan class="b">switchboard  </tspan><tspan class="t">routes 191 tools down to the few a query needs</tspan></text>
<text x="64" y="228" class="a" style="animation-delay:3.74s"><tspan class="b">watchtower   </tspan><tspan class="t">2,774 GitHub threads in, 5 worth answering out</tspan></text>
<text x="46" y="260" class="a" style="animation-delay:3.92s"><tspan class="fn">rank</tspan><tspan class="m">(</tspan><tspan class="m">by=</tspan><tspan class="arg">&quot;shipped&quot;</tspan><tspan class="m">)</tspan></text>
<text x="732" y="260" text-anchor="end" class="p m" style="animation-delay:3.92s;animation-duration:0.7s">running</text>
<text x="732" y="260" text-anchor="end" class="a ok" style="animation-delay:4.62s">ok</text>
<text x="64" y="284" class="a" style="animation-delay:4.72s"><tspan class="b">1  fred  </tspan><tspan class="t">live at biofred.us, ~1,450 tests, merges its own PRs</tspan></text>
<text x="46" y="316" class="a" style="animation-delay:4.90s"><tspan class="fn">check</tspan><tspan class="m">(</tspan><tspan class="arg">status</tspan><tspan class="m">)</tspan></text>
<text x="732" y="316" text-anchor="end" class="p m" style="animation-delay:4.90s;animation-duration:0.7s">running</text>
<text x="732" y="316" text-anchor="end" class="a ok" style="animation-delay:5.60s">ok</text>
<text x="64" y="340" class="a" style="animation-delay:5.70s"><tspan class="t">open to forward-deployed, AI and SWE roles</tspan></text>
<text x="64" y="364" class="a" style="animation-delay:5.88s"><tspan class="m">Bay Area, NYC, Seattle or remote. F-1 STEM OPT.</tspan></text>
<text x="46" y="400" class="a" style="animation-delay:6.36s"><tspan class="ok">answer  </tspan><tspan class="b">Aunsh builds agents that show their work, then ships them.</tspan></text>
<text x="28" y="434" class="a" style="animation-delay:6.76s"><tspan class="fn">&gt; </tspan><tspan class="cur" style="animation-delay:6.76s">_</tspan></text>
</svg>
