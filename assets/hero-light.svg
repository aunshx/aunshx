<svg xmlns="http://www.w3.org/2000/svg" width="760" height="448" viewBox="0 0 760 448" role="img" aria-labelledby="title desc">
<title id="title">aunsh</title>
<desc id="desc">Aunsh builds agents that show their work. An agent asks who aunsh is and calls five tools: search finds an MS ECE from UC Davis, read finds FRED at biofred.us with spatial agents over 11.8 million rows, pytest reports about 1,450 passed, the agent opens, reviews and merges its own PRs, and status is open to forward-deployed, AI and SWE roles.</desc>
<defs>
<linearGradient id="grad" x1="0" x2="1" y1="0" y2="0"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--arg)"/></linearGradient>
<filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<style>:root{--bg:#ffffff;--panel:#f6f8fa;--line:#d0d7de;--text:#1f2328;--muted:#59636e;--accent:#c4371a;--arg:#0550ae;--ok:#1a7f37;--warn:#9a6700}
text{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:15px;fill:var(--text);white-space:pre}
.m{fill:var(--muted)}.fn{fill:var(--accent)}.arg{fill:var(--arg)}.ok{fill:var(--ok)}.b{font-weight:700}
.q{font-weight:600}.r{fill:var(--text)}.hd{font-size:12.5px;fill:var(--muted)}
.name{font-size:64px;font-weight:800;letter-spacing:-1px;fill:var(--text)}
.glow{fill:var(--accent);opacity:0}
.ans{fill:var(--panel);stroke:var(--line)}
.a{opacity:0;animation:in .3s ease-out forwards}
.glow.a{animation-name:glow}
.flash{opacity:0;animation-name:flash;animation-timing-function:steps(1,end);animation-fill-mode:forwards}
.p{opacity:0;animation-name:flash;animation-timing-function:steps(1,end);animation-fill-mode:forwards}
.spin{transform-box:fill-box;transform-origin:center;animation:spin .6s linear infinite}
.type{clip-path:inset(0 100% 0 0);animation-name:type;animation-fill-mode:forwards}
.cur{fill:var(--accent);animation:blink 1.1s steps(1) infinite}
.live{fill:var(--ok);animation:pulse 1.6s ease-in-out infinite}
@keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes glow{to{opacity:.35}}
@keyframes flash{from{opacity:1}to{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes type{to{clip-path:inset(0 0 0 0)}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){
.a,.type,.cur,.live{animation:none;opacity:1;clip-path:none;transform:none}
.glow.a{opacity:.35}.flash,.p{display:none}
}</style>
<rect x="0.5" y="0.5" width="759" height="447" rx="12" fill="var(--bg)" stroke="var(--line)"/>
<circle cx="32" cy="20" r="4" class="live"/>
<text x="44" y="24" class="hd">aunsh/agent</text>
<text x="732" y="24" text-anchor="end" class="hd">5 tool calls · streaming</text>
<path d="M1 38.5H759" stroke="var(--line)"/>
<text x="28" y="112" class="name flash" style="animation-delay:0.20s;animation-duration:0.09s">#x9@k</text>
<text x="28" y="112" class="name flash" style="animation-delay:0.29s;animation-duration:0.09s">q7%$a</text>
<text x="28" y="112" class="name flash" style="animation-delay:0.38s;animation-duration:0.09s">a&amp;!zh</text>
<text x="28" y="112" class="name flash" style="animation-delay:0.47s;animation-duration:0.09s">au?1s</text>
<text x="28" y="112" class="name flash" style="animation-delay:0.56s;animation-duration:0.09s">aun/h</text>
<text x="28" y="112" class="name flash" style="animation-delay:0.65s;animation-duration:0.09s">auns_</text>
<text x="28" y="112" class="name glow a" style="animation-delay:0.74s" filter="url(#blur)">aunsh</text>
<text x="28" y="112" class="name a" style="fill:url(#grad);animation-delay:0.74s">aunsh</text>
<text x="30" y="144" class="m type" style="animation-delay:0.89s;animation-duration:0.85s;animation-timing-function:steps(34)">builds agents that show their work</text>
<path d="M28 168.5H732" stroke="var(--line)" stroke-dasharray="3 4" class="a" style="animation-delay:1.74s"/>
<text x="28" y="190" class="fn a" style="animation-delay:1.94s">&gt;</text>
<text x="46" y="190" class="q type" style="animation-delay:1.94s;animation-duration:0.59s;animation-timing-function:steps(13)">who is aunsh?</text>
<g class="p" style="animation-delay:2.78s;animation-duration:0.55s"><circle cx="34" cy="219" r="5.5" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="34" cy="219" r="5.5" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="9 26" stroke-linecap="round" class="spin"/></g>
<text x="50" y="224" class="a" style="animation-delay:2.78s"><tspan class="fn">search</tspan><tspan class="m">(</tspan><tspan class="arg">&quot;aunsh&quot;</tspan><tspan class="m">)</tspan></text>
<text x="29" y="224" class="ok a" style="animation-delay:3.33s">✓</text>
<text x="248" y="224" class="m a" style="animation-delay:3.33s">→</text>
<text x="270" y="224" class="r type" style="animation-delay:3.33s;animation-duration:0.60s;animation-timing-function:steps(42)">one human. MS ECE, UC Davis. ships agents.</text>
<g class="p" style="animation-delay:4.03s;animation-duration:0.55s"><circle cx="34" cy="249" r="5.5" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="34" cy="249" r="5.5" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="9 26" stroke-linecap="round" class="spin"/></g>
<text x="50" y="254" class="a" style="animation-delay:4.03s"><tspan class="fn">read</tspan><tspan class="m">(</tspan><tspan class="arg">&quot;biofred.us&quot;</tspan><tspan class="m">)</tspan></text>
<text x="29" y="254" class="ok a" style="animation-delay:4.58s">✓</text>
<text x="248" y="254" class="m a" style="animation-delay:4.58s">→</text>
<text x="270" y="254" class="r type" style="animation-delay:4.58s;animation-duration:0.53s;animation-timing-function:steps(37)">FRED. spatial agents over 11.8M rows.</text>
<g class="p" style="animation-delay:5.21s;animation-duration:0.55s"><circle cx="34" cy="279" r="5.5" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="34" cy="279" r="5.5" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="9 26" stroke-linecap="round" class="spin"/></g>
<text x="50" y="284" class="a" style="animation-delay:5.21s"><tspan class="fn">run</tspan><tspan class="m">(</tspan><tspan class="arg">&quot;pytest&quot;</tspan><tspan class="m">)</tspan></text>
<text x="29" y="284" class="ok a" style="animation-delay:5.76s">✓</text>
<text x="248" y="284" class="m a" style="animation-delay:5.76s">→</text>
<text x="270" y="284" class="r type" style="animation-delay:5.76s;animation-duration:0.20s;animation-timing-function:steps(13)">~1,450 passed</text>
<g class="p" style="animation-delay:6.06s;animation-duration:0.55s"><circle cx="34" cy="309" r="5.5" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="34" cy="309" r="5.5" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="9 26" stroke-linecap="round" class="spin"/></g>
<text x="50" y="314" class="a" style="animation-delay:6.06s"><tspan class="fn">prs</tspan><tspan class="m">(</tspan><tspan class="m">author=</tspan><tspan class="arg">&quot;agent&quot;</tspan><tspan class="m">)</tspan></text>
<text x="29" y="314" class="ok a" style="animation-delay:6.61s">✓</text>
<text x="248" y="314" class="m a" style="animation-delay:6.61s">→</text>
<text x="270" y="314" class="r type" style="animation-delay:6.61s;animation-duration:0.47s;animation-timing-function:steps(33)">opens, reviews and merges its own</text>
<g class="p" style="animation-delay:7.18s;animation-duration:0.55s"><circle cx="34" cy="339" r="5.5" fill="none" stroke="var(--line)" stroke-width="2"/><circle cx="34" cy="339" r="5.5" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="9 26" stroke-linecap="round" class="spin"/></g>
<text x="50" y="344" class="a" style="animation-delay:7.18s"><tspan class="fn">check</tspan><tspan class="m">(</tspan><tspan class="arg">&quot;status&quot;</tspan><tspan class="m">)</tspan></text>
<text x="29" y="344" class="ok a" style="animation-delay:7.73s">✓</text>
<text x="248" y="344" class="m a" style="animation-delay:7.73s">→</text>
<text x="270" y="344" class="r type" style="animation-delay:7.73s;animation-duration:0.47s;animation-timing-function:steps(33)">open to forward-deployed, AI, SWE</text>
<rect x="18" y="363" width="724" height="32" rx="6" class="ans a" style="animation-delay:8.60s"/>
<text x="28" y="384" class="ok b a" style="animation-delay:8.60s">answer</text>
<text x="108" y="384" class="b type" style="animation-delay:8.70s;animation-duration:1.36s;animation-timing-function:steps(61)">Aunsh builds agents that show their work. Worth an interview.</text>
<text x="28" y="424" class="a" style="animation-delay:10.26s"><tspan class="fn">&gt; </tspan><tspan class="cur">█</tspan></text>
</svg>
